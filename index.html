<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cursor Pointer Example</title>
  <style>
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer; /* 👈 makes it a pointer */
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <button>Hover Me</button>
</body>
</html>
